<section id="{section-id}" class="sectionBlogSlider01 sectionBlogSlider01--items-{items-count} {classVar}" aria-labelledby="{heading-id}" data-blog-slider>
    <div class="sectionBlogSlider01-heading">
        {header-primary}
        <div class="sectionBlogSlider01-controls" hidden>
            <button type="button" data-blog-slider-previous aria-label="{previous-label}">&larr;</button>
            <button type="button" data-blog-slider-next aria-label="{next-label}">&rarr;</button>
        </div>
    </div>

    <div class="sectionBlogSlider01-viewport" data-blog-slider-viewport tabindex="0">
        <div class="sectionBlogSlider01-track">
            {items}
        </div>
    </div>
</section>
