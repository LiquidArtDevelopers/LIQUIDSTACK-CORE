<section id="{root-id}"
         class="sectionCommerceCatalog01 sectionCommerceCatalog01--items-{item-count}"
         aria-labelledby="{heading-id}"
         data-commerce-interest-scope
         data-commerce-inquiry-url="{inquiry-path}"
         data-commerce-selected-items="{selected-items}"
         data-commerce-added-status="{added-status}"
         data-commerce-removed-status="{removed-status}">
    <div class="sectionCommerceCatalog01-shell">
        <header class="sectionCommerceCatalog01-header">
            <{header-tag} id="{heading-id}">{header-text}</{header-tag}>
            <p>{intro-text}</p>
        </header>
        <form class="sectionCommerceCatalog01-filters" action="{catalog-path}" method="get" role="search">
            <div>
                <label for="{root-id}-search">{search-label}</label>
                <input id="{root-id}-search" name="q" type="search" value="{search-value}" placeholder="{search-placeholder}" maxlength="100">
            </div>
            <div>
                <label for="{root-id}-category">{category-label}</label>
                <select id="{root-id}-category" name="category"{category-disabled}>{category-options}</select>
            </div>
            <div>
                <label for="{root-id}-tag">{tag-label}</label>
                <select id="{root-id}-tag" name="tag"{tag-disabled}>{tag-options}</select>
            </div>
            <button type="submit">{filter-submit}</button>
            <a href="{catalog-path}">{filter-clear}</a>
        </form>
        <div class="sectionCommerceCatalog01-grid">
            {items}
        </div>
        <p class="sectionCommerceCatalog01-empty"{empty-hidden}>{empty-text}</p>
        <aside class="sectionCommerceCatalog01-interest" aria-label="{interest-label}">
            <p><strong data-commerce-interest-count>{interest-count}</strong> {interest-summary}</p>
            <a href="{inquiry-path}" data-commerce-interest-link>{interest-label}</a>
            <p class="sectionCommerceCatalog01-status" role="status" aria-live="polite" data-commerce-interest-status></p>
        </aside>
    </div>
</section>
