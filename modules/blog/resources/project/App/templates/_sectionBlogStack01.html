<section id="{section-id}" class="sectionBlogStack01 sectionBlogStack01--items-{items-count} {classVar}" aria-labelledby="{heading-id}" data-blog-collection="sectionBlogStack01" data-blog-load-mode="{load-mode}" data-blog-stack01>
    {header-primary}

    <div class="sectionBlogStack01-list" data-blog-collection-items>
        {items}
    </div>

    <div class="sectionBlogStack01-pagination">
        {next-control}
        <p class="sectionBlogStack01-status" role="status" aria-live="polite" data-blog-collection-status data-state="{status-state}" data-loading-message="{loading-message}" data-end-message="{end-message}" data-error-message="{error-message}" {status-visibility}>{status-text}</p>
    </div>
</section>
