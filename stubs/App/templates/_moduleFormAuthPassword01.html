<div id="{root-id}" class="moduleFormAuth moduleFormAuthPassword01 {classVar}">
    <form id="{form-id}" class="moduleFormAuth-form" action="{form-action}" method="{form-method}" aria-labelledby="{legend-id}">
        {hidden-fields}

        <fieldset class="moduleFormAuth-fieldset">
            <legend id="{legend-id}" class="moduleFormAuth-legend"{legend-lang-attr}>{legend-text}</legend>
            <p class="moduleFormAuth-intro"{intro-lang-attr}>{intro-text}</p>

            <ul class="moduleFormAuth-requirements" aria-label="{requirements-label}">
                <li{requirement-length-lang-attr}>{requirement-length-text}</li>
            </ul>

            <div class="moduleFormAuth-field moduleFormAuth-field--password">
                <label for="{password-id}"{password-label-lang-attr}>{password-label-text}</label>
                <div class="moduleFormAuth-passwordControl">
                    <input id="{password-id}" name="{password-name}" type="password" autocomplete="new-password" placeholder="{password-placeholder}" aria-describedby="{password-hint-id} {password-error-id}" data-auth-password-input{password-placeholder-lang-attr} required>
                    <button class="moduleFormAuth-toggle" type="button" aria-controls="{password-id}" aria-pressed="false" aria-label="{toggle-show-text}" data-auth-password-toggle data-auth-label-show="{toggle-show-text}" data-auth-label-hide="{toggle-hide-text}">
                        <span class="moduleFormAuth-toggleIcon" aria-hidden="true"></span>
                        <span class="moduleFormAuth-visuallyHidden" data-auth-password-toggle-text{toggle-show-lang-attr}>{toggle-show-text}</span>
                    </button>
                </div>
                <p id="{password-hint-id}" class="moduleFormAuth-hint"{password-hint-lang-attr}>{password-hint-text}</p>
                <p id="{password-error-id}" class="moduleFormAuth-error" aria-live="polite">{password-error-slot}</p>
            </div>

            <div class="moduleFormAuth-field moduleFormAuth-field--password">
                <label for="{confirmation-id}"{confirmation-label-lang-attr}>{confirmation-label-text}</label>
                <div class="moduleFormAuth-passwordControl">
                    <input id="{confirmation-id}" name="{confirmation-name}" type="password" autocomplete="new-password" placeholder="{confirmation-placeholder}" aria-describedby="{confirmation-hint-id} {confirmation-error-id}" data-auth-password-input{confirmation-placeholder-lang-attr} required>
                    <button class="moduleFormAuth-toggle" type="button" aria-controls="{confirmation-id}" aria-pressed="false" aria-label="{toggle-show-text}" data-auth-password-toggle data-auth-label-show="{toggle-show-text}" data-auth-label-hide="{toggle-hide-text}">
                        <span class="moduleFormAuth-toggleIcon" aria-hidden="true"></span>
                        <span class="moduleFormAuth-visuallyHidden" data-auth-password-toggle-text{toggle-show-lang-attr}>{toggle-show-text}</span>
                    </button>
                </div>
                <p id="{confirmation-hint-id}" class="moduleFormAuth-hint"{confirmation-hint-lang-attr}>{confirmation-hint-text}</p>
                <p id="{confirmation-error-id}" class="moduleFormAuth-error" aria-live="polite">{confirmation-error-slot}</p>
            </div>
        </fieldset>

        <button class="moduleFormAuth-submit" type="submit"{submit-lang-attr}>{submit-text}</button>
        <div class="moduleFormAuth-feedback" aria-live="polite">{feedback-slot}</div>
        <div class="moduleFormAuth-secondaryAction">{secondary-action-slot}</div>
    </form>
</div>
