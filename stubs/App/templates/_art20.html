<article class="art20 {classVar} {variant-class}">
    <div class="art20-media">
        <img
            data-lang="{img-dl}"
            src="{img-src}"
            alt="{img-alt}"
            title="{img-title}"
            width="{img-width}"
            height="{img-height}"
            loading="lazy"
            decoding="async">
    </div>

    <div class="art20-content">
        {header-primary}
        {intro}
        {button-primary}
    </div>
</article>
